[workspace]
resolver = "2"
members = ["auction", "item-nft", "fixed-price", "offer-board"]

# Keep dalek 2.x so soroban-env-host 22 testutils compile (ed25519-dalek 3 breaks ChaCha20Rng).
# After a broad `cargo update`, re-pin with:
#   cargo update -p ed25519-dalek@3.0.0 --precise 2.2.0

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
