[package]
name = "item-nft"
version = "0.1.0"
edition = "2021"
description = "Stellar4 item NFT — mint/burn/transfer for Marketplace settlement"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
