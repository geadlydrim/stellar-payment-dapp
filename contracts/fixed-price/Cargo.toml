[package]
name = "fixed-price"
version = "0.1.0"
edition = "2021"
description = "Stellar4 Marketplace fixed-price sale — XLM pay + NFT transfer"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
item-nft = { path = "../item-nft" }
