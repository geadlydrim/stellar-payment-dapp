[package]
name = "offer-board"
version = "0.1.0"
edition = "2021"
description = "Stellar4 Marketplace offer-board trade — accept/reject with XLM and/or NFT offers"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
item-nft = { path = "../item-nft" }
